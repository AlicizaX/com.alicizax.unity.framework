name: Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    uses: AlicizaX/public-github-actions-Public/.github/workflows/publish-upm-release.yml@main
    with:
      package_json_path: package.json
    secrets: inherit

  notify:
    needs: publish-release
    if: needs.publish-release.outputs.released == 'true'
    uses: AlicizaX/public-github-actions-Public/.github/workflows/qq-notify.yml@main
    with:
      release_tag: ${{ needs.publish-release.outputs.tag }}
    secrets: inherit
